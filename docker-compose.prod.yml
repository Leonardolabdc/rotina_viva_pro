# Produção — stack Fase 6: FastAPI worker (+ Whisper opcional para STT local)
# Next.js: deploy separado na Vercel (apps/web)
#
# Uso:
#   docker compose -f docker-compose.prod.yml up --build -d
#   curl http://127.0.0.1:8000/health

services:
  whisper:
    image: hwdsl2/whisper-server:latest
    container_name: rotina-whisper
    restart: unless-stopped
    profiles: ["whisper"]
    environment:
      WHISPER_MODEL: base
      WHISPER_LANGUAGE: pt
      WHISPER_PORT: "9000"
      WHISPER_THREADS: "4"
      WHISPER_VAD_FILTER: "relaxed"
      WHISPER_EMPTY_RETRY: "true"
      WHISPER_NO_SPEECH_THRESHOLD: "0.42"
    volumes:
      - whisper-models:/var/lib/whisper
      - ./docker/whisper_api_server.py:/opt/src/api_server.py:ro
    ports:
      - "127.0.0.1:9000:9000"

  api-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: rotina-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      PORT: "8000"
      ROTINA_DATA_DIR: /data
      ROTINA_RAG_BACKEND: pgvector
      ROTINA_CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      CREWAI_DISABLE_TELEMETRY: "true"
      ROTINA_ENABLE_CREWAI: "false"
      ROTINA_ENABLE_ML_LAB: "false"
      ROTINA_LANGFUSE_ENABLED: "false"
      # STT local (activar profile whisper): OPENAI_TRANSCRIBE_BASE_URL=http://whisper:9000/v1
    volumes:
      - ./data:/data
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10)",
        ]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 180s

volumes:
  whisper-models:
  hf-cache:
